name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
          extra-conf: |
            allow-import-from-derivation = true
            accept-flake-config = true
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Install dependencies and check lock consistency
        run: nix develop --command bun run check:lockfile

      - name: Check types
        run: nix develop --command bun run typecheck

      - name: Lint
        run: nix develop --command bun run lint

      - name: Check formatting
        run: nix develop --command bun run check:format

      - name: Test with coverage
        run: nix develop --command bun run test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

      - name: Check Nix package and development shell
        run: nix build --no-link .#checks.x86_64-linux.application .#checks.x86_64-linux.devshell
